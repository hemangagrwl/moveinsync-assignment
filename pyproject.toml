[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trip-distance-engine"
version = "1.0.0"
description = "Billable distance reconstruction for cab trips with missing or noisy GPS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.1",
  "numpy>=1.26",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "structlog>=24.1",
  "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "mypy>=1.10", "ruff>=0.4", "psutil>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = ["slow: long-running tests (deselect with -m 'not slow')"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["backfill"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "psutil.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"src/backfill/api/mapview.py" = ["E501"]  # embedded HTML/JS template
