name: billable-distance

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: backfill
      POSTGRES_PASSWORD: backfill
      POSTGRES_DB: backfill
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backfill -d backfill"]
      interval: 2s
      timeout: 3s
      retries: 30

  router:
    build: .
    command: ["uvicorn", "backfill.mockrouter:app", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      ROUTER_LATENCY_MS: "40"
      ROUTER_RATE_PER_S: "200"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      router:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://backfill:backfill@db:5432/backfill
      ROUTING_MODE: http
      ROUTING_URL: http://router:8081
      ROUTING_TIMEOUT_S: "2"
      BREAKER_FAILURE_THRESHOLD: "3"
      BREAKER_RESET_TIMEOUT_S: "10"
      DEGRADED_RETRY_S: "15"
      JWT_SECRET: local-demo-secret-change-me-in-any-real-deployment
      USERS_FILE: /app/deploy/users.json
      LOG_JSON: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')"]
      interval: 3s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/on-call.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
