name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check src tests scripts bench
      - run: mypy
      - run: pytest

  compose-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: docker compose up --build -d
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/ready && exit 0
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: End-to-end demo
        run: python scripts/demo.py
      - name: Provider outage and automatic recovery
        run: python scripts/outage_drill.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
